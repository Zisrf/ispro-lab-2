name: CI/CD Pipeline

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build --verbosity normal

  analyze:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0'

      - name: Install analyzers
        run: |
          dotnet tool install --global dotnet-format 2>/dev/null || true
          dotnet tool install --global dotnet-sdk-9.0 2>/dev/null || true

      - name: Restore dependencies
        run: dotnet restore

      - name: Analyze
        run: |
          echo "=== Running dotnet format --verify-no-changes ==="
          dotnet format --verify-no-changes --verbosity diagnostic || true
          
          echo "=== Running dotnet build with analyzers ==="
          dotnet build --no-restore 2>&1 | tee build.log
          
          echo "=== Analyzer Summary ==="
          grep -E "(warning|error|Warning|Error)" build.log || echo "No warnings or errors found"

  security:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0'

      - name: Restore dependencies
        run: dotnet restore

      - name: Install GitLeaks
        run: |
          curl -sSfL https://raw.githubusercontent.com/zricethezav/gitleaks/v8.18.2/gitleaks_8.18.2_linux_arm64.tar.gz | tar -xz
          sudo mv gitleaks /usr/local/bin/

      - name: Run GitLeaks
        run: gitleaks detect --source . --verbose || true

      - name: Check for vulnerable dependencies
        run: |
          dotnet list package --vulnerable 2>&1 || true

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: PlantManager/Dockerfile
          push: false
          tags: plantmanager:latest
          load: true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'plantmanager:latest'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  coverage:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build with coverage
        run: dotnet build --no-restore

      - name: Test with coverage
        run: dotnet test --no-build --collect:"XPlat Code Coverage"

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: '**/coverage.cobertura.xml'
          fail_ci_if_error: false

  dependency-audit:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0'

      - name: Install dotnet-outdated
        run: dotnet tool install --global dotnet-outdated 2>/dev/null || true

      - name: Check for outdated packages
        run: |
          dotnet outdated PlantManager/PlantManager.csproj || true

      - name: Restore and check compatibility
        run: |
          dotnet restore
          dotnet list package --include-transitive